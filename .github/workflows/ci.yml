name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: ledgerguard_owner
          POSTGRES_DB: ledgerguard
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerguard_owner -d ledgerguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # uv reads the Python version from the checked-out .python-version file.
      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline model tests and local Postgres tests
        env:
          CI: "true"
          DATABASE_URL: postgresql://ledgerguard_owner:ci-only-${{ github.run_id }}@127.0.0.1:5432/ledgerguard
        run: uv run pytest -q
