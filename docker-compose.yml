services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: ledgerguard_owner
      POSTGRES_DB: ledgerguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LEDGERGUARD_APP_PASSWORD: ${LEDGERGUARD_APP_PASSWORD:?Set LEDGERGUARD_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledgerguard_postgres:/var/lib/postgresql/data
      - ./infra/postgres/001_app_role.sh:/docker-entrypoint-initdb.d/001_app_role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard_owner -d ledgerguard"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  ledgerguard_postgres:
