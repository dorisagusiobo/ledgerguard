[project]
name = "ledgerguard"
version = "0.1.0"
description = "AI agent that audits invoices and spending against policy and contracts, with human review."
readme = "README.md"
authors = [
    { name = "Doris Agusiobo Echianu", email = "38115960+dorisagusiobo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.9.0",
    "pydantic>=2.14.1",
]

[project.scripts]
ledgerguard = "ledgerguard:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
